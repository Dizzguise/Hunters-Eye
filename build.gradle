plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }

tasks.register('verifyPowers', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.enochmods.hunterseye.PowerVerification'
}
check.dependsOn verifyPowers
tasks.register('verifyControls', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.enochmods.hunterseye.ControlVerification'
}
check.dependsOn verifyControls
// Tests use the executable verifyPowers harness, not JUnit discovery.
tasks.named('test').configure { enabled = false }

tasks.register('verifyResourcePack') {
    inputs.dir('resource-pack/pack')
    doLast {
        def root = file('resource-pack/pack')
        def expected = ['pack.mcmeta', 'assets/hunterseye/models/item/hunters_eye.json',
                        'assets/hunterseye/textures/item/hunters_eye.png', 'assets/minecraft/items/ender_eye.json'] as Set
        def actual = fileTree(root).files.collect { root.toPath().relativize(it.toPath()).toString().replace('\\', '/') } as Set
        if (actual != expected) throw new GradleException('Unexpected artwork pack contents.')
        def json = new groovy.json.JsonSlurper()
        def metadata = json.parse(new File(root, 'pack.mcmeta')).pack
        if (metadata.min_format != [88, 0] || metadata.max_format != [88, 0]) {
            throw new GradleException('Artwork must target Minecraft 26.2 resource format 88.0.')
        }
        def selector = json.parse(new File(root, 'assets/minecraft/items/ender_eye.json')).model
        if (selector.type != 'minecraft:select' || selector.property != 'minecraft:custom_model_data' || selector.index != 0
                || selector.cases.size() != 1 || selector.cases[0].when != 'hunterseye:hunters_eye'
                || selector.cases[0].model.model != 'hunterseye:item/hunters_eye'
                || selector.fallback.model != 'minecraft:item/ender_eye') {
            throw new GradleException('Artwork selector or vanilla fallback differs from the server item contract.')
        }
        def model = json.parse(new File(root, 'assets/hunterseye/models/item/hunters_eye.json'))
        if (model.parent != 'minecraft:item/generated' || model.textures.layer0 != 'hunterseye:item/hunters_eye') {
            throw new GradleException('Invalid original Eye model.')
        }
    }
}
tasks.register('resourcePack', Zip) {
    dependsOn verifyResourcePack
    from('resource-pack/pack')
    archiveFileName = 'hunters-eye-resource-pack-26.2-0.2.4.zip'
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
check.dependsOn verifyResourcePack, gradle.includedBuild('optional-client').task(':check')
assemble.dependsOn resourcePack, gradle.includedBuild('optional-client').task(':assemble')
