plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
tasks.register('verifyProtocol') {
    def own = file('src/main/java/com/enochmods/eyevisuals/protocol/OwnerFullPayload.java')
    def core = file('../src/main/java/com/enochmods/eyevisuals/protocol/OwnerFullPayload.java')
    inputs.files(own, core)
    doLast {
        if (!core.exists() || !Arrays.equals(own.bytes, core.bytes)) {
            throw new GradleException('Optional visual protocol sources must match byte for byte.')
        }
    }
}
tasks.register('verifyFreshness', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.enochmods.eyevisuals.OwnerVisualStateVerification'
}
tasks.named('test').configure { enabled = false }
check.dependsOn verifyProtocol, verifyFreshness
